name: Deploy Documentation

on:
  workflow_run:
    workflows: ["Docs can build"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, as in GitHub's Pages starter workflow: a deployment
# in progress finishes, and only the latest queued run follows it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs

      # Uploads _site/, the action's default path and TypeDoc's `out`.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5

  # The repository's Pages source must be "GitHub Actions", not a branch.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
