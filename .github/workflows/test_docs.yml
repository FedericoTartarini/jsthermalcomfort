name: Docs can build

on:
  push:
    branches: [main]
  # No `branches` filter: a PR whose base is a feature branch (a stacked PR, or
  # anything targeting dev-v2) would otherwise get no check from this workflow
  # at all. An absent check reads as a passing one. See #200.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run docs
