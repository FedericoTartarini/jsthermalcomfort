name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: a stacked PR (one whose base is another feature
  # branch) would otherwise get no checks at all, which reads as passing
  # rather than as skipped. See #200.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.13.0 is the minimum in package.json's `engines`.
        node-version: [22.13.0, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run check:format
      - run: npm run lint
      # Strict tsc: the build type-checks the sources, and check:types:tests
      # the tests, both with the tsc --init set (ADR 0020).
      - run: npm run build
      - run: npm run check:types:tests
      - run: npm run check:types
      - run: npx publint --strict
      # The esm-only profile ignores the CJS resolutions (node10 and
      # node16-cjs); the require job below covers CommonJS consumers.
      - run: npx attw --pack --profile esm-only

  # require() of an ES module loads without a warning from Node 22.13.0, the
  # minimum in `engines`. The packed tarball is installed in a fresh directory,
  # so the package name resolves through its `exports` as a consumer's does.
  require:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: npm ci
      - name: Install the packed package in a CommonJS consumer
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cp tests/package/require.cjs "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install "$RUNNER_TEMP"/jsthermalcomfort-*.tgz
      - name: require() the package
        working-directory: ${{ runner.temp }}/consumer
        run: node require.cjs
